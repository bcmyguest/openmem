<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 360" width="1080" height="360" role="img" aria-labelledby="ov-context-t ov-context-d" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" style="max-width:100%;height:auto"><title id="ov-context-t">OpenMem context management</title><desc id="ov-context-d">Coding agents (Claude Code, Codex, OpenCode 1) send requests through the OpenMem context proxy, a LiteLLM hook that trims at 125k tokens (95k for Haiku) without an LLM call and forwards to the model API (Anthropic, or ChatGPT for Codex). The proxy writes every turn verbatim to a SQLite session store, which the agent reads back with the smart_compact_search and smart_compact_sql MCP tools. OpenCode 2 trims in a native plugin with no proxy and writes the same store. Native compaction replaces history with an LLM summary, where exact values can be lost; OpenMem keeps every turn verbatim and searchable.</desc><rect width="1080" height="360" rx="14" fill="#eef0f9"/><text x="24" y="32" font-size="15" font-weight="700" fill="#1b1d2a">B · Context management</text><text x="232" y="32" font-size="13" fill="#555b72">long sessions stay under the limit; nothing is summarized away</text><rect x="24" y="54" width="236" height="132" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="40" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">CODING AGENT</text><rect x="36" y="96" width="212" height="26" rx="7" fill="#f9f9fd" stroke="#e1e3ee"/><text x="46" y="113.5" font-size="13.5" font-weight="600"  fill="#1b1d2a">Claude Code</text><rect x="36" y="128" width="212" height="26" rx="7" fill="#f9f9fd" stroke="#e1e3ee"/><text x="46" y="145.5" font-size="13.5" font-weight="600"  fill="#1b1d2a">Codex</text><rect x="36" y="160" width="212" height="26" rx="7" fill="#f9f9fd" stroke="#e1e3ee"/><text x="46" y="177.5" font-size="13.5" font-weight="600"  fill="#1b1d2a">OpenCode 1</text><rect x="340" y="54" width="300" height="132" rx="12" fill="#e8eaf9" stroke="#4651a6" stroke-width="1.5"/><text x="356" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2f3987">CONTEXT PROXY</text><text x="356" y="100" font-size="13" font-style="italic" fill="#555b72">LiteLLM pre-call hook</text><text x="356" y="131" font-size="14" font-weight="700"  fill="#1b1d2a">trims at 125k tokens (Haiku 95k)</text><text x="356" y="152" font-size="14" font-weight="500"  fill="#1b1d2a">no LLM call · cache-stable cut</text><rect x="720" y="54" width="336" height="132" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="736" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">MODEL API</text><rect x="732" y="96" width="312" height="26" rx="7" fill="#f9f9fd" stroke="#e1e3ee"/><text x="742" y="113.5" font-size="13.5" font-weight="600"  fill="#1b1d2a">Anthropic</text><rect x="732" y="128" width="312" height="26" rx="7" fill="#f9f9fd" stroke="#e1e3ee"/><text x="742" y="145.5" font-size="13.5" font-weight="600"  fill="#1b1d2a">ChatGPT (Codex)</text><rect x="340" y="236" width="300" height="104" rx="12" fill="#e8eaf9" stroke="#4651a6" stroke-width="1.5"/><text x="356" y="262" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2f3987">SESSION STORE</text><text x="356" y="282" font-size="13" font-style="italic" fill="#555b72">SQLite · every turn, verbatim</text><text x="356" y="313" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1d2a">smart_compact_search</text><text x="356" y="334" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1d2a">smart_compact_sql</text><rect x="24" y="236" width="236" height="104" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="40" y="262" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">OPENCODE 2</text><text x="40" y="282" font-size="13" font-style="italic" fill="#555b72">native plugin, no proxy</text><text x="40" y="313" font-size="14" font-weight="500"  fill="#1b1d2a">same trim, same store</text><path d="M264 110 L336 110" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M336 110 L328.79642318117857 113.47972427288984 L328.79642318117857 106.52027572711016 Z" fill="#4651a6"/><text x="300" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">requests</text><path d="M644 110 L716 110" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M716 110 L708.7964231811786 113.47972427288984 L708.7964231811786 106.52027572711016 Z" fill="#4651a6"/><text x="680" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">trimmed</text><path d="M440 190 L440 232" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M440 232 L436.5202757271102 224.7964231811786 L443.4797242728898 224.7964231811786 Z" fill="#4651a6"/><text x="450" y="216" text-anchor="start" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">every turn</text><path d="M336 306 L300 306 L300 154 L264 154" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M264 154 L271.20357681882143 150.52027572711015 L271.20357681882143 157.47972427288985 Z" fill="#4651a6"/><text x="300" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">MCP</text><path d="M264 322 L336 322" fill="none" stroke="#4651a6" stroke-width="1.75" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M336 322 L328.79642318117857 325.4797242728898 L328.79642318117857 318.5202757271102 Z" fill="#4651a6"/><rect x="720" y="234" width="336" height="52" rx="10" fill="#ffffff" stroke="#e1e3ee"/><text x="736" y="255" font-size="12.5" font-weight="700" fill="#555b72">Native compaction</text><text x="736" y="274" font-size="13.5" font-weight="500" fill="#1b1d2a">LLM summary: exact values can be lost</text><rect x="720" y="296" width="336" height="52" rx="10" fill="#e8eaf9" stroke="#4651a6"/><text x="736" y="317" font-size="12.5" font-weight="700" fill="#2f3987">OpenMem</text><text x="736" y="336" font-size="13.5" font-weight="500" fill="#1b1d2a">every turn kept verbatim and searchable</text></svg>
