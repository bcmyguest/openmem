<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 682" width="360" height="682" role="img" aria-labelledby="ov-memory-t ov-memory-d" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" style="max-width:100%;height:auto"><title id="ov-memory-t">OpenMem memory architecture</title><desc id="ov-memory-d">Sources (Git repos with Markdown docs and code outlines, Obsidian vaults, notes, papers, bookmarks, RSS and OpenAlex feeds) flow into the OpenMem indexer, which writes to one active, swappable memory provider: Hindsight by default, mem0 or Cognee. The OpenMem MCP exposes memory_recall, memory_add, memory_search, memory_reflect, memory_pages tools and more to coding agents (Claude Code, Codex, Cursor, OpenCode); session hooks recall at session start and retain at stop.</desc><rect width="360" height="682" rx="14" fill="#eef0f9"/><text x="16" y="28" font-size="15" font-weight="700" fill="#1b1d2a">A · Memory</text><rect x="16" y="48" width="328" height="109" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="32" y="74" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">SOURCES</text><text x="32" y="105" font-size="14" font-weight="500"  fill="#1b1d2a">Git repos: Markdown docs, code outlines</text><text x="32" y="126" font-size="14" font-weight="500"  fill="#1b1d2a">Obsidian vaults · notes · papers · bookmarks</text><text x="32" y="147" font-size="14" font-weight="500"  fill="#1b1d2a">RSS · OpenAlex feeds</text><path d="M180 161 L180 187" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M180 187 L176.52027572711015 179.7964231811786 L183.47972427288985 179.7964231811786 Z" fill="#4651a6"/><text x="192" y="178" text-anchor="start" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">index</text><rect x="16" y="191" width="328" height="67" rx="12" fill="#e8eaf9" stroke="#4651a6" stroke-width="1.5"/><text x="32" y="217" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2f3987">OPENMEM INDEXER</text><text x="32" y="248" font-size="14" font-weight="500"  fill="#1b1d2a">Polls repos, watches folders, re-indexes</text><path d="M180 262 L180 288" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M180 288 L176.52027572711015 280.79642318117857 L183.47972427288985 280.79642318117857 Z" fill="#4651a6"/><text x="192" y="279" text-anchor="start" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">retain</text><rect x="16" y="292" width="328" height="88" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="32" y="318" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">MEMORY PROVIDER</text><text x="32" y="338" font-size="13" font-style="italic" fill="#555b72">one active, swappable</text><text x="32" y="369" font-size="14" font-weight="500"  fill="#1b1d2a">Hindsight (default) · mem0 · Cognee · …</text><path d="M180 384 L180 410" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M180 410 L176.52027572711015 402.79642318117857 L183.47972427288985 402.79642318117857 Z" fill="#4651a6"/><path d="M180 384 L183.47972427288985 391.20357681882143 L176.52027572711015 391.20357681882143 Z" fill="#4651a6"/><rect x="16" y="414" width="328" height="130" rx="12" fill="#e8eaf9" stroke="#4651a6" stroke-width="1.5"/><text x="32" y="440" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2f3987">OPENMEM MCP</text><text x="32" y="471" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1d2a">memory_recall · memory_add</text><text x="32" y="492" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1d2a">memory_search · memory_reflect</text><text x="32" y="513" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1d2a">memory_pages_*</text><text x="32" y="534" font-size="14" font-weight="500"  fill="#555b72">+ export/import, status…</text><path d="M180 548 L180 574" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M180 574 L176.52027572711015 566.7964231811786 L183.47972427288985 566.7964231811786 Z" fill="#4651a6"/><path d="M180 548 L183.47972427288985 555.2035768188214 L176.52027572711015 555.2035768188214 Z" fill="#4651a6"/><text x="192" y="564" font-size="12" font-weight="600" fill="#555b72">tools · session hooks</text><rect x="16" y="578" width="328" height="88" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="32" y="604" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">CODING AGENTS</text><text x="32" y="635" font-size="14" font-weight="500"  fill="#1b1d2a">Claude Code · Codex · Cursor · OpenCode</text><text x="32" y="656" font-size="14" font-weight="500"  fill="#555b72">hooks: recall at start, retain at stop</text></svg>
