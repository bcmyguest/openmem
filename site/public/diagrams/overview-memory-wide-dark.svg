<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 372" width="1080" height="372" role="img" aria-labelledby="ov-memory-t ov-memory-d" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" style="max-width:100%;height:auto"><title id="ov-memory-t">OpenMem memory architecture</title><desc id="ov-memory-d">Sources (Git repos with Markdown docs and code outlines, Obsidian vaults, notes, papers, bookmarks, RSS and OpenAlex feeds) flow into the OpenMem indexer, which writes to one active, swappable memory provider: Hindsight by default, mem0 or Cognee. The OpenMem MCP exposes memory_recall, memory_add, memory_search, memory_reflect, memory_pages tools and more to coding agents (Claude Code, Codex, Cursor, OpenCode); session hooks recall at session start and retain at stop.</desc><rect width="1080" height="372" rx="14" fill="#121523"/><text x="24" y="32" font-size="15" font-weight="700" fill="#eceef7">A · Memory</text><text x="128" y="32" font-size="13" fill="#b4b9d0">your sources become memory any agent can query</text><rect x="24" y="54" width="176" height="200" rx="12" fill="#171a25" stroke="#343a54" stroke-width="1"/><text x="40" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#b4b9d0">SOURCES</text><text x="40" y="111" font-size="14" font-weight="500"  fill="#eceef7">Git repos</text><text x="40" y="132" font-size="14" font-weight="500"  fill="#b4b9d0">docs, code outlines</text><text x="40" y="153" font-size="14" font-weight="500"  fill="#eceef7">Obsidian vaults</text><text x="40" y="174" font-size="14" font-weight="500"  fill="#eceef7">Notes · papers</text><text x="40" y="195" font-size="14" font-weight="500"  fill="#eceef7">Bookmarks</text><text x="40" y="216" font-size="14" font-weight="500"  fill="#eceef7">RSS · OpenAlex feeds</text><rect x="238" y="54" width="176" height="200" rx="12" fill="#262d55" stroke="#aab4f6" stroke-width="1.5"/><text x="254" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#c6cdfb">OPENMEM INDEXER</text><text x="254" y="111" font-size="14" font-weight="500"  fill="#eceef7">Polls repos</text><text x="254" y="132" font-size="14" font-weight="500"  fill="#eceef7">Watches folders</text><text x="254" y="153" font-size="14" font-weight="500"  fill="#eceef7">Re-indexes on change</text><text x="254" y="174" font-size="14" font-weight="500"  fill="#b4b9d0">One sink per provider</text><rect x="452" y="54" width="176" height="200" rx="12" fill="#171a25" stroke="#343a54" stroke-width="1"/><text x="468" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#b4b9d0">MEMORY PROVIDER</text><text x="468" y="100" font-size="13" font-style="italic" fill="#b4b9d0">one active, swappable</text><rect x="464" y="116" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="474" y="133.5" font-size="13.5" font-weight="700"  fill="#eceef7">Hindsight (default)</text><rect x="464" y="148" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="474" y="165.5" font-size="13.5" font-weight="600"  fill="#eceef7">mem0</text><rect x="464" y="180" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="474" y="197.5" font-size="13.5" font-weight="600"  fill="#eceef7">Cognee</text><rect x="464" y="212" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="474" y="229.5" font-size="13.5" font-weight="600"  fill="#b4b9d0">…</text><rect x="666" y="54" width="176" height="230" rx="12" fill="#262d55" stroke="#aab4f6" stroke-width="1.5"/><text x="682" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#c6cdfb">OPENMEM MCP</text><text x="682" y="111" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#eceef7">memory_recall</text><text x="682" y="132" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#eceef7">memory_add</text><text x="682" y="153" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#eceef7">memory_search</text><text x="682" y="174" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#eceef7">memory_reflect</text><text x="682" y="195" font-size="12.5" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#eceef7">memory_pages_*</text><text x="682" y="216" font-size="14" font-weight="500"  fill="#b4b9d0">+ export/import</text><text x="682" y="237" font-size="14" font-weight="500"  fill="#b4b9d0">+ status, forget…</text><rect x="880" y="54" width="176" height="200" rx="12" fill="#171a25" stroke="#343a54" stroke-width="1"/><text x="896" y="80" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#b4b9d0">CODING AGENTS</text><rect x="892" y="96" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="902" y="113.5" font-size="13.5" font-weight="600"  fill="#eceef7">Claude Code</text><rect x="892" y="128" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="902" y="145.5" font-size="13.5" font-weight="600"  fill="#eceef7">Codex</text><rect x="892" y="160" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="902" y="177.5" font-size="13.5" font-weight="600"  fill="#eceef7">Cursor</text><rect x="892" y="192" width="152" height="26" rx="7" fill="#1e2231" stroke="#343a54"/><text x="902" y="209.5" font-size="13.5" font-weight="600"  fill="#eceef7">OpenCode</text><path d="M204 144 L234 144" fill="none" stroke="#aab4f6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M234 144 L226.7964231811786 147.47972427288985 L226.7964231811786 140.52027572711015 Z" fill="#aab4f6"/><text x="219" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#b4b9d0" stroke="#121523" stroke-width="4" paint-order="stroke" stroke-linejoin="round">index</text><path d="M418 144 L448 144" fill="none" stroke="#aab4f6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M448 144 L440.79642318117857 147.47972427288985 L440.79642318117857 140.52027572711015 Z" fill="#aab4f6"/><text x="433" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#b4b9d0" stroke="#121523" stroke-width="4" paint-order="stroke" stroke-linejoin="round">retain</text><path d="M632 144 L662 144" fill="none" stroke="#aab4f6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M662 144 L654.7964231811786 147.47972427288985 L654.7964231811786 140.52027572711015 Z" fill="#aab4f6"/><path d="M632 144 L639.2035768188214 140.52027572711015 L639.2035768188214 147.47972427288985 Z" fill="#aab4f6"/><path d="M846 124 L876 124" fill="none" stroke="#aab4f6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M876 124 L868.7964231811786 127.47972427288984 L868.7964231811786 120.52027572711016 Z" fill="#aab4f6"/><path d="M846 124 L853.2035768188214 120.52027572711016 L853.2035768188214 127.47972427288984 Z" fill="#aab4f6"/><text x="861" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#b4b9d0" stroke="#121523" stroke-width="4" paint-order="stroke" stroke-linejoin="round">tools</text><path d="M968 258 L968 306 L784 306 L784 288" fill="none" stroke="#aab4f6" stroke-width="1.75" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M784 288 L787.4797242728898 295.20357681882143 L780.5202757271102 295.20357681882143 Z" fill="#aab4f6"/><text x="948" y="326" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c6cdfb">session hooks</text><text x="948" y="342" text-anchor="middle" font-size="12" fill="#b4b9d0">recall at start · retain at stop</text></svg>
