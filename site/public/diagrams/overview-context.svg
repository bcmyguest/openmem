<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 677" width="360" height="677" role="img" aria-labelledby="ov-context-t ov-context-d" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" style="max-width:100%;height:auto"><title id="ov-context-t">OpenMem context management</title><desc id="ov-context-d">Coding agents (Claude Code, Codex, OpenCode 1) send requests through the OpenMem context proxy, a LiteLLM hook that trims at 125k tokens (95k for Haiku) without an LLM call and forwards to the model API (Anthropic, or ChatGPT for Codex). The proxy writes every turn verbatim to a SQLite session store, which the agent reads back with the smart_compact_search and smart_compact_sql MCP tools. OpenCode 2 trims in a native plugin with no proxy and writes the same store. Native compaction replaces history with an LLM summary, where exact values can be lost; OpenMem keeps every turn verbatim and searchable.</desc><rect width="360" height="677" rx="14" fill="#eef0f9"/><text x="16" y="28" font-size="15" font-weight="700" fill="#1b1d2a">B · Context management</text><rect x="16" y="48" width="328" height="67" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="32" y="74" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">CODING AGENT</text><text x="32" y="105" font-size="14" font-weight="500"  fill="#1b1d2a">Claude Code · Codex · OpenCode 1</text><path d="M130 119 L130 145" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M130 145 L126.52027572711016 137.7964231811786 L133.47972427288985 137.7964231811786 Z" fill="#4651a6"/><text x="142" y="136" text-anchor="start" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">requests</text><path d="M250 145 L250 119" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M250 119 L253.47972427288985 126.20357681882142 L246.52027572711015 126.20357681882142 Z" fill="#4651a6"/><text x="262" y="136" text-anchor="start" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">MCP reads</text><rect x="16" y="149" width="328" height="88" rx="12" fill="#e8eaf9" stroke="#4651a6" stroke-width="1.5"/><text x="32" y="175" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2f3987">CONTEXT PROXY</text><text x="32" y="195" font-size="13" font-style="italic" fill="#555b72">LiteLLM pre-call hook</text><text x="32" y="226" font-size="14" font-weight="700"  fill="#1b1d2a">trims at 125k (Haiku 95k) · no LLM call</text><path d="M95 241 L95 267" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M95 267 L91.52027572711016 259.79642318117857 L98.47972427288984 259.79642318117857 Z" fill="#4651a6"/><path d="M265 241 L265 267" fill="none" stroke="#4651a6" stroke-width="1.75"  stroke-linejoin="round"/><path d="M265 267 L261.5202757271102 259.79642318117857 L268.4797242728898 259.79642318117857 Z" fill="#4651a6"/><rect x="16" y="271" width="158" height="109" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="32" y="297" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">MODEL API</text><text x="32" y="328" font-size="14" font-weight="500"  fill="#1b1d2a">Anthropic</text><text x="32" y="349" font-size="14" font-weight="500"  fill="#1b1d2a">ChatGPT</text><text x="32" y="370" font-size="14" font-weight="500"  fill="#555b72">(Codex)</text><rect x="186" y="271" width="158" height="109" rx="12" fill="#e8eaf9" stroke="#4651a6" stroke-width="1.5"/><text x="202" y="297" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#2f3987">SESSION STORE</text><text x="202" y="328" font-size="14" font-weight="500"  fill="#1b1d2a">SQLite, every</text><text x="202" y="349" font-size="14" font-weight="500"  fill="#1b1d2a">turn, verbatim</text><text x="16" y="402" font-size="12" font-weight="600" fill="#555b72">agent reads it back over MCP:</text><text x="16" y="420" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1b1d2a">smart_compact_search · smart_compact_sql</text><path d="M265 460 L265 434" fill="none" stroke="#4651a6" stroke-width="1.75" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M265 434 L268.4797242728898 441.20357681882143 L261.5202757271102 441.20357681882143 Z" fill="#4651a6"/><text x="275" y="451" text-anchor="start" font-size="12" font-weight="600" fill="#555b72" stroke="#eef0f9" stroke-width="4" paint-order="stroke" stroke-linejoin="round">same store</text><rect x="16" y="464" width="328" height="67" rx="12" fill="#ffffff" stroke="#e1e3ee" stroke-width="1"/><text x="32" y="490" font-size="11.5" font-weight="700" letter-spacing="1.1" fill="#555b72">OPENCODE 2</text><text x="32" y="521" font-size="14" font-weight="500"  fill="#1b1d2a">native plugin, no proxy</text><rect x="16" y="547" width="328" height="52" rx="10" fill="#ffffff" stroke="#e1e3ee"/><text x="32" y="568" font-size="12.5" font-weight="700" fill="#555b72">Native compaction</text><text x="32" y="587" font-size="13.5" font-weight="500" fill="#1b1d2a">LLM summary: exact values can be lost</text><rect x="16" y="609" width="328" height="52" rx="10" fill="#e8eaf9" stroke="#4651a6"/><text x="32" y="630" font-size="12.5" font-weight="700" fill="#2f3987">OpenMem</text><text x="32" y="649" font-size="13.5" font-weight="500" fill="#1b1d2a">every turn kept verbatim and searchable</text></svg>
