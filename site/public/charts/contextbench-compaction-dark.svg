<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" aria-label="Time per compaction event" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Time per compaction event</title><desc>A native compaction waits on a summary call (median 10.7 s). OpenMem trims without a model call; the whole request that carried a trim, answer included, took 4.0 s, against 1.7 s for other requests. Source: ContextBench, synthetic tasks · Claude Haiku 5.5.</desc><rect width="480" height="470" rx="12" fill="#171a25"/><text x="16" y="26" font-size="17" font-weight="700" fill="#eceef7">Time per compaction event</text><text x="16" y="50" font-size="15" fill="#b4b9d0">A native compaction waits on a summary call (median</text><text x="16" y="70" font-size="15" fill="#b4b9d0">10.7 s). OpenMem trims without a model call; the whole</text><text x="16" y="90" font-size="15" fill="#b4b9d0">request that carried a trim, answer included, took</text><text x="16" y="110" font-size="15" fill="#b4b9d0">4.0 s, against 1.7 s for other requests.</text><line x1="16" x2="16" y1="148" y2="364" stroke="#3d4460"/><text x="16" y="380" font-size="12" text-anchor="start" fill="#b4b9d0">0 s</text><line x1="240" x2="240" y1="148" y2="364" stroke="#262b3d"/><text x="240" y="380" font-size="12" text-anchor="middle" fill="#b4b9d0">10 s</text><line x1="464" x2="464" y1="148" y2="364" stroke="#262b3d"/><text x="464" y="380" font-size="12" text-anchor="end" fill="#b4b9d0">20 s</text><text x="16" y="164" font-size="13" font-weight="500" fill="#b4b9d0">Native: summary call (model only) <tspan font-weight="400" fill="#b4b9d0">· n = 22</tspan></text><rect x="16" y="172" width="240.35720799999996" height="16" rx="4" fill="#9aa0b8"/><line x1="185.60279616000003" x2="376.38179968000003" y1="194" y2="194" stroke="#b4b9d0" stroke-width="1.25"/><line x1="185.60279616000003" x2="185.60279616000003" y1="191" y2="197" stroke="#b4b9d0" stroke-width="1.25"/>