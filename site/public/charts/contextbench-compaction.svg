<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 394" width="480" height="394" role="img" aria-label="Time per compaction event" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Time per compaction event</title><desc>A native compaction waits on a summary call (median 10.7 s). OpenMem makes no model call: its trimming request takes 4.0 s, against 1.7 s for an ordinary request.</desc><rect width="480" height="394" rx="12" fill="#ffffff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#1b1d2a">Time per compaction event</text><text x="16" y="50" font-size="15" fill="#555b72">A native compaction waits on a summary call (median 10.7</text><text x="16" y="70" font-size="15" fill="#555b72">s). OpenMem makes no model call: its trimming request</text><text x="16" y="90" font-size="15" fill="#555b72">takes 4.0 s, against 1.7 s for an ordinary request.</text><line x1="16" x2="16" y1="128" y2="344" stroke="#c9ccda"/><text x="16" y="360" font-size="12" text-anchor="start" fill="#555b72">0 s</text><line x1="240" x2="240" y1="128" y2="344" stroke="#e8e9f1"/><text x="240" y="360" font-size="12" text-anchor="middle" fill="#555b72">10 s</text><line x1="464" x2="464" y1="128" y2="344" stroke="#e8e9f1"/><text x="464" y="360" font-size="12" text-anchor="end" fill="#555b72">20 s</text><text x="16" y="144" font-size="13" font-weight="500" fill="#555b72">Native: summary call <tspan font-weight="400" fill="#555b72">· n = 22</tspan></text><rect x="16" y="152" width="240.35720799999996" height="16" rx="4" fill="#6b7088"/><line x1="185.60279616000003" x2="376.38179968000003" y1="174" y2="174" stroke="#555b72" stroke-width="1.25"/><line x1="185.60279616000003" x2="185.60279616000003" y1="171" y2="177" stroke="#555b72" stroke-width="1.25"/><line x1="376.38179968000003" x2="376.38179968000003" y1="171" y2="177" stroke="#555b72" stroke-width="1.25"/><text x="262.35720799999996" y="165" font-size="12.5" font-weight="700" fill="#1b1d2a">10.