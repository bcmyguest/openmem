<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img" aria-label="Time per compaction event" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><title>Time per compaction event</title><desc>A native compaction waits on a summary call (median 10.7 s). OpenMem trims without a model call; the whole request that carried a trim, answer included, took 4.0 s, against 1.7 s for other requests. Source: ContextBench, synthetic tasks · Claude Haiku 5.5.</desc><rect width="480" height="470" rx="12" fill="#ffffff"/><text x="16" y="26" font-size="17" font-weight="700" fill="#1b1d2a">Time per compaction event</text><text x="16" y="50" font-size="15" fill="#555b72">A native compaction waits on a summary call (median</text><text x="16" y="70" font-size="15" fill="#555b72">10.7 s). OpenMem trims without a model call; the whole</text><text x="16" y="90" font-size="15" fill="#555b72">request that carried a trim, answer included, took</text><text x="16" y="110" font-size="15" fill="#555b72">4.0 s, against 1.7 s for other requests.</text><line x1="16" x2="16" y1="148" y2="364" stroke="#c9ccda"/><text x="16" y="380" font-size="12" text-anchor="start" fill="#555b72">0 s</text><line x1="240" x2="240" y1="148" y2="364" stroke="#e8e9f1"/><text x="240" y="380" font-size="12" text-anchor="middle" fill="#555b72">10 s</text><line x1="464" x2="464" y1="148" y2="364" stroke="#e8e9f1"/><text x="464" y="380" font-size="12" text-anchor="end" fill="#555b72">20 s</text><text x="16" y="164" font-size="13" font-weight="500" fill="#555b72">Native: summary call (model only) <tspan font-weight="400" fill="#555b72">· n = 22</tspan></text><rect x="16" y="172" width="240.35720799999996" height="16" rx="4" fill="#6b7088"/><line x1="185.60279616000003" x2="376.38179968000003" y1="194" y2="194" stroke="#555b72" stroke-width="1.25"/><line x1="185.60279616000003" x2="185.60279616000003" y1="191" y2="197" stroke="#555b72" stroke-width="1.25"/><line x1="376.38179968000003" x2="376.38179968000003" y1="191" y2="197" stroke="#555b72" stroke-width="1.25"/><text x="262.35720799999996" y="185" font-size="12.5" font-weight="700" fill="#1b1d2a">10.7 s</text><text x="16" y="218" font-size="13" font-weight="500" fill="#555b72">Native: Claude Code timer <tspan font-weight="400" fill="#555b72">· n = 22</tspan></text><rect x="16" y="226" width="277.3344" height="16" rx="4" fill="#6b7088"/><line x1="219.48831999999996" x2="412.6144" y1="248" y2="248" stroke="#555b72" stroke-width="1.25"/><line x1="219.48831999999996" x2="219.48831999999996" y1="245" y2="251" stroke="#555b72" stroke-width="1.25"/><line x1="412.6144" x2="412.6144" y1="245" y2="251" stroke="#555b72" stroke-width="1.25"/><text x="299.3344" y="239" font-size="12.5" font-weight="700" fill="#1b1d2a">12.4 s</text><text x="16" y="272" font-size="13" font-weight="700" fill="#1b1d2a">OpenMem: whole request incl. answer (upper bound) <tspan font-weight="400" fill="#555b72">· n = 81</tspan></text><rect x="16" y="280" width="89.9778432" height="16" rx="4" fill="#4651a6"/><line x1="84.75084159999999" x2="136.05640640000001" y1="302" y2="302" stroke="#555b72" stroke-width="1.25"/><line x1="84.75084159999999" x2="84.75084159999999" y1="299" y2="305" stroke="#555b72" stroke-width="1.25"/><line x1="136.05640640000001" x2="136.05640640000001" y1="299" y2="305" stroke="#555b72" stroke-width="1.25"/><text x="111.9778432" y="293" font-size="12.5" font-weight="700" fill="#1b1d2a">4.0 s</text><text x="16" y="326" font-size="13" font-weight="700" fill="#1b1d2a">OpenMem: other requests <tspan font-weight="400" fill="#555b72">· n = 2723</tspan></text><rect x="16" y="334" width="38.3185824" height="16" rx="4" fill="#4651a6"/><line x1="47.025796480000004" x2="72.41446272000002" y1="356" y2="356" stroke="#555b72" stroke-width="1.25"/><line x1="47.025796480000004" x2="47.025796480000004" y1="353" y2="359" stroke="#555b72" stroke-width="1.25"/><line x1="72.41446272000002" x2="72.41446272000002" y1="353" y2="359" stroke="#555b72" stroke-width="1.25"/><text x="60.3185824" y="347" font-size="12.5" font-weight="700" fill="#1b1d2a">1.7 s</text><text x="16" y="400" font-size="11.5" fill="#555b72">Bar: median. Whisker: 10th to 90th percentile.</text><text x="16" y="416" font-size="11.5" fill="#555b72">Native (run B) and OpenMem (run D) ran on different LiteLLM builds</text><text x="16" y="431" font-size="11.5" fill="#555b72">at different times; compare the scale, not small gaps.</text><text x="16" y="458" font-size="11.5" fill="#555b72">Source: ContextBench, synthetic tasks · Claude Haiku 5.5</text></svg>
