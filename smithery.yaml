# Smithery — https://smithery.ai/docs/build/project-config
# Launches the published openmem-mcp stdio server. Needs a configured OpenMem
# stack (npx openmem setup) so MEMORY_PROVIDER / API URLs resolve.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      stackRoot:
        type: string
        description: Optional PM_STACK_ROOT (defaults to ~/.local/share/personal-memory/stack)
      memoryProvider:
        type: string
        enum: [hindsight, mem0, cognee]
        description: Optional MEMORY_PROVIDER override
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'openmem-mcp'],
      env: {
        ...(config.stackRoot ? { PM_STACK_ROOT: config.stackRoot } : {}),
        ...(config.memoryProvider ? { MEMORY_PROVIDER: config.memoryProvider } : {}),
      },
    })
