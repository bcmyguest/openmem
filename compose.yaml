name: personal-memory

# Hindsight memory API and the project/Obsidian indexer.
# Set HINDSIGHT_ENV_FILE to use an env file other than ~/.config/hindsight/hindsight.env.

# Shared build for the indexer and its state-volume init step.
x-indexer-build: &indexer-build
  build:
    context: .
    dockerfile: indexer/Dockerfile

services:
  # OpenAI-compatible proxy in front of the model server. Hindsight calls it at http://litellm:4000/v1 with the
  # fixed aliases memory-retain, memory-reflect, memory-consolidate. Routes live in LITELLM_CONFIG (set by scripts/setup.sh).
  # Internal network only: nothing is published to the host.
  litellm:
    image: ghcr.io/berriai/litellm:v1.105.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: ${LITELLM_ENV_FILE:-${HOME}/.config/hindsight/litellm.env}
    volumes:
      - ${LITELLM_CONFIG:?run scripts/setup.sh}:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  hindsight:
    depends_on:
      litellm:
        condition: service_healthy
    image: ghcr.io/vectorize-io/hindsight:latest
    # Embedded Postgres needs more than Docker's 64 MB default /dev/shm.
    shm_size: 1g
    env_file: ${HINDSIGHT_ENV_FILE:-${HOME}/.config/hindsight/hindsight.env}
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:9999:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume: the image's hindsight user (UID 1000) owns it on first use, unlike a host bind mount.
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  indexer:
    <<: *indexer-build
    image: personal-memory-indexer:local
    # Host UID/GID from .env, written by scripts/setup.sh. The image needs no passwd entry for this user.
    user: "${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh}"
    # Same absolute paths inside the container so bank and document IDs match host paths.
    # Read-only: the indexer reads repositories and writes only its state volume below. Tree-sitter outlines
    # need no writes, and CodeGraph's .codegraph/ writes are gone.
    # Secret paths under $HOME are masked by compose.override.yaml, generated by scripts/gen-masks.sh (required).
    volumes:
      - ${HOME}:${HOME}:ro
      # Writable state (state.json, lock). Its mount point is inside the read-only $HOME mount.
      - indexer-state:${HOME}/.cache/hindsight-project-index
    environment:
      HOME: ${HOME}
      HINDSIGHT_URL: http://hindsight:8888
    depends_on:
      hindsight:
        condition: service_healthy
      indexer-state-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Named volumes are created root-owned. This one-off root step gives the state volume to the host UID, then exits.
  indexer-state-init:
    <<: *indexer-build
    image: personal-memory-indexer:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown ${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh} /state"]
    volumes:
      - indexer-state:/state
    restart: "no"

  # Opt-in: docker compose --profile notebooklm up -d notebooklm. Syncs NotebookLM notebooks into Hindsight banks.
  # Login is on the host (README "NotebookLM"); the storage under ~/.config/notebooklm is bind-mounted read-write.
  notebooklm:
    profiles: ["notebooklm"]
    build:
      context: .
      dockerfile: sync/Dockerfile
    image: personal-memory-notebooklm:local
    # Host UID/GID from .env, written by scripts/setup.sh; the bind-mounted login storage must stay host-owned.
    user: "${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh}"
    environment:
      HINDSIGHT_URL: http://hindsight:8888
      NOTEBOOKLM_HOME: /data/notebooklm
    volumes:
      - type: bind
        source: ${HOME}/.config/notebooklm
        target: /data/notebooklm
        bind:
          create_host_path: false
      # Per-machine override (only the keys you change). Create the file before starting; compose does not create it.
      - type: bind
        source: ${NOTEBOOKLM_OVERRIDE:-${HOME}/.config/hindsight/notebooklm.yml}
        target: /etc/notebooklm/override.yml
        read_only: true
        bind:
          create_host_path: false
      # Writable sync state (state.json). The image creates it 0777, so Docker copies that mode into the new volume.
      - notebooklm-state:/data/state
    depends_on:
      hindsight:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hindsight-data:
  indexer-state:
  notebooklm-state:
