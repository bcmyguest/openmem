name: openmem

# Memory provider stack (Hindsight by default) and the project/Obsidian indexer.
# Set HINDSIGHT_ENV_FILE to use an env file other than ~/.config/hindsight/hindsight.env.
#
# Provider selection is by compose profile:
#   - litellm and hindsight carry the profile "hindsight" (and "notebooklm", which needs them).
#   - indexer and indexer-state-init have no profile and no hard provider dependency; they start for every provider.
#   - Another provider ships providers/<id>/compose.yaml (see providers/_template/compose.yaml) with its own
#     profile, and layers over this file: docker compose -f compose.yaml -f providers/<id>/compose.yaml --profile <id> up -d
# Compose starts no profiled service unless a profile is enabled, so the plain `docker compose up -d` of the README
# needs COMPOSE_PROFILES=hindsight in .env (or --profile hindsight). Note that a --profile flag replaces
# COMPOSE_PROFILES rather than adding to it; name every profile you want on the command line.

# Shared build for the indexer and its state-volume init step.
x-indexer-build: &indexer-build
  build:
    context: .
    dockerfile: indexer/Dockerfile

services:
  # OpenAI-compatible proxy in front of the model server. Hindsight calls it at http://litellm:4000/v1 with the
  # fixed aliases memory-retain, memory-reflect, memory-consolidate. Routes live in LITELLM_CONFIG (set by scripts/setup.sh).
  # Internal network only: nothing is published to the host.
  litellm:
    profiles: ["hindsight", "notebooklm"]
    image: ghcr.io/berriai/litellm:v1.106.6
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file: ${LITELLM_ENV_FILE:-${HOME}/.config/hindsight/litellm.env}
    volumes:
      - ${LITELLM_CONFIG:?run scripts/setup.sh}:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  hindsight:
    profiles: ["hindsight", "notebooklm"]
    depends_on:
      litellm:
        condition: service_healthy
    # Pinned to the digest running before the pin (org.opencontainers.image.version 1.0.0). Bump deliberately.
    image: ghcr.io/vectorize-io/hindsight@sha256:a88678c038b0e4340822b02a5efc566c56d8176b5bffa731bc433fd37f978e4c
    # Embedded Postgres needs more than Docker's 64 MB default /dev/shm.
    shm_size: 1g
    env_file: ${HINDSIGHT_ENV_FILE:-${HOME}/.config/hindsight/hindsight.env}
    ports:
      # Host ports from .env (HINDSIGHT_PORT, HINDSIGHT_CP_PORT); defaults 8888 and 9999.
      - "127.0.0.1:${HINDSIGHT_PORT:-8888}:8888"
      - "127.0.0.1:${HINDSIGHT_CP_PORT:-9999}:9999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Named volume: the image's hindsight user (UID 1000) owns it on first use, unlike a host bind mount.
      - hindsight-data:/home/hindsight/.pg0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  indexer:
    <<: *indexer-build
    image: openmem-indexer:local
    # Host UID/GID from .env, written by scripts/setup.sh. The image needs no passwd entry for this user.
    user: "${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh}"
    # Same absolute paths inside the container so bank and document IDs match host paths.
    # Read-only: the indexer reads repositories and writes only its state volume below. Tree-sitter outlines
    # need no writes, and CodeGraph's .codegraph/ writes are gone.
    # Secret paths under $HOME are masked by compose.override.yaml, generated by scripts/gen-masks.sh (required).
    volumes:
      - ${HOME}:${HOME}:ro
      # Writable state (state.json, lock). Its mount point is inside the read-only $HOME mount.
      - indexer-state:${HOME}/.cache/hindsight-project-index
    environment:
      HOME: ${HOME}
      HINDSIGHT_URL: http://hindsight:8888
    depends_on:
      # Soft: waits for Hindsight to be healthy when its profile is active and is ignored otherwise (other providers
      # add their own dependency in providers/<id>/compose.yaml). Unlike a hard dependency, an unhealthy Hindsight
      # only logs a warning; the indexer starts anyway and its watcher retries.
      hindsight:
        condition: service_healthy
        required: false
      indexer-state-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Named volumes are created root-owned. This one-off root step gives the state volume to the host UID, then exits.
  indexer-state-init:
    <<: *indexer-build
    image: openmem-indexer:local
    user: "0:0"
    entrypoint: ["sh", "-c", "chown ${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh} /state"]
    volumes:
      - indexer-state:/state
    restart: "no"

  # Opt-in: docker compose --profile ollama up -d ollama. Used when the host has no Ollama; LiteLLM reaches it at
  # http://ollama:11434 on the compose network. Port 11434 is published on loopback so the wizard can probe and pull.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Opt-in: docker compose --profile notebooklm up -d notebooklm. Syncs into notebooklm::* banks on the active MEMORY_SINK.
  # Login is on the host (README "NotebookLM"); the storage under ~/.config/notebooklm is bind-mounted read-write.
  notebooklm:
    profiles: ["notebooklm"]
    build:
      context: .
      dockerfile: sync/Dockerfile
    image: openmem-notebooklm:local
    # Host UID/GID from .env, written by scripts/setup.sh; the bind-mounted login storage must stay host-owned.
    user: "${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh}"
    environment:
      HINDSIGHT_URL: http://hindsight:8888
      MEMORY_SINK: ${MEMORY_SINK:-hindsight}
      MEMORY_API_URL: ${MEMORY_API_URL:-}
      NOTEBOOKLM_HOME: /data/notebooklm
      NOTEBOOKLM_STATE: /data/state/state.json
    volumes:
      - type: bind
        source: ${HOME}/.config/notebooklm
        target: /data/notebooklm
        bind:
          create_host_path: false
      # Per-machine override (only the keys you change). Create the file before starting; compose does not create it.
      - type: bind
        source: ${NOTEBOOKLM_OVERRIDE:-${HOME}/.config/hindsight/notebooklm.yml}
        target: /etc/notebooklm/override.yml
        read_only: true
        bind:
          create_host_path: false
      # Writable sync state (state.json). The image creates it 0777, so Docker copies that mode into the new volume.
      - notebooklm-state:/data/state
    depends_on:
      hindsight:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Opt-in: docker compose --profile context-proxy up -d context-proxy. LiteLLM in front of Anthropic for coding
  # agents: compresses large tool results and trims long sessions (docs/context-proxy.md). Separate from the litellm
  # service and outside the hindsight profile, so Hindsight's own model traffic never passes through it.
  context-proxy:
    profiles: ["context-proxy"]
    image: ghcr.io/berriai/litellm:v1.106.6
    command: ["--config", "/app/proxy/config.yaml", "--port", "4000"]
    # LITELLM_MASTER_KEY (and any provider keys for extra routes). Written by install-coding-agent.
    env_file: ${CONTEXT_PROXY_ENV_FILE:-${HOME}/.config/personal-memory/context-proxy.env}
    # Host UID/GID from .env, written by scripts/setup.sh; the context store stays host-owned (docs/context-store.md).
    user: "${HOST_UID:?run scripts/setup.sh}:${HOST_GID:?run scripts/setup.sh}"
    ports:
      - "127.0.0.1:${CONTEXT_PROXY_PORT:-4100}:4000"
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      OPENMEM_STATE_DIR: /state
      HINDSIGHT_URL: ${CONTEXT_PROXY_HINDSIGHT_URL:-http://hindsight:8888}
      CONTEXT_PROXY_ENABLED: ${CONTEXT_PROXY_ENABLED:-1}
      # From config.toml [context_proxy] trim_at_tokens / compress_over_tokens / standing_instruction / chars_per_token, [compaction] max_chars
      # and [context_store] ttl_days / embedding_model,
      # written into .env by scripts/setup.mjs and install-coding-agent; a shell export overrides .env.
      CONTEXT_TRIM_AT_TOKENS: ${CONTEXT_TRIM_AT_TOKENS:-120000}
      CONTEXT_COMPRESS_OVER_TOKENS: ${CONTEXT_COMPRESS_OVER_TOKENS:-4000}
      CONTEXT_COMPACTION_MAX_CHARS: ${CONTEXT_COMPACTION_MAX_CHARS:-12000}
      CONTEXT_STANDING_INSTRUCTION: ${CONTEXT_STANDING_INSTRUCTION:-1}
      CONTEXT_CHARS_PER_TOKEN: ${CONTEXT_CHARS_PER_TOKEN:-2.5}
      # Session databases (docs/context-store.md): [context_store] ttl_days and embedding_model. Vectors are off while
      # CONTEXT_EMBEDDING_MODEL is empty; the embeddings URL is the container's view of an OpenAI-compatible
      # /embeddings endpoint (Ollama on the host by default). CONTEXT_EMBEDDING_API_KEY, if needed, goes in the env file.
      CONTEXT_STORE_TTL_DAYS: ${CONTEXT_STORE_TTL_DAYS:-30}
      CONTEXT_EMBEDDING_MODEL: ${CONTEXT_EMBEDDING_MODEL:-}
      CONTEXT_EMBEDDING_URL: ${CONTEXT_PROXY_EMBEDDING_URL:-http://host.docker.internal:11434/v1}
    volumes:
      - ./proxy:/app/proxy:ro
      # Create it first (mode 700, host-owned); compose would otherwise create a root-owned directory.
      - type: bind
        source: ${OPENMEM_STATE_DIR:-${HOME}/.local/share/openmem}/context
        target: /state/context
        bind:
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  hindsight-data:
  indexer-state:
  notebooklm-state:
  ollama-data:
