name: Publish MCP Registry listing

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match listing to published npm package
        run: |
          set -euo pipefail
          version=$(npm view @bcmyguest/openmem version)
          jq --arg version "$version" \
            '.version = $version | .packages[0].version = $version' \
            server.json > server.published.json
          mv server.published.json server.json
      - name: Install MCP publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340 \
            mcp-publisher.tar.gz | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate and publish
        run: |
          set -euo pipefail
          ./mcp-publisher validate server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
