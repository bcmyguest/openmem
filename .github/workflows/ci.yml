name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so a release ships only a tree that passed it.
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # engines.node floor (@clack/prompts needs 20.12) and the release runtime.
        node: ["20.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # scripts/tests/test_*.mjs (includes the packed-tarball install test) and
      # test_wizard.sh. The wizard tests stub docker and curl: no docker is needed.
      - run: npm test
      - name: Package contents gate
        run: npm run pack:check
