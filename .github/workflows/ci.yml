name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so a release ships only a tree that passed it.
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # engines.node floor (node:sqlite with FTS5 first ships in 22.16) and the release runtime.
        node: ["22.16.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # scripts/tests/test_*.mjs (includes the packed-tarball install test) and
      # test_wizard.sh. The wizard tests stub docker and curl: no docker is needed.
      - run: npm test
      - name: Package contents gate
        run: npm run pack:check

  indexer:
    name: test (indexer pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install indexer test deps
        run: |
          pip install --no-cache-dir \
            pytest==8.3.4 \
            pyyaml==6.0.3 \
            watchfiles==1.3.0 \
            tree-sitter-language-pack==1.22.1
      - run: python3 -m pytest -q
        working-directory: indexer

  site:
    name: site build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://bcmyguest.github.io
          BASE_PATH: /openmem/
