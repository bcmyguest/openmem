# Dev-only: Python tests for indexer/ and proxy/ (not published to npm).
[project]
name = "openmem-python"
version = "0.0.0"
description = "OpenMem indexer and context-proxy pytest suite (dev)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "prek>=0.5,<0.6",
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
  "watchfiles>=1.3,<2",
  "tree-sitter-language-pack>=1.22,<2",
  "pytest-sugar>=1.1,<2",
  "pytest-xdist>=3.8,<4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["indexer/tests", "proxy/tests"]
pythonpath = ["indexer", "proxy"]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = ["-n", "auto"]
